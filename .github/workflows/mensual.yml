name: Pipeline confirming mensual

on:
  schedule:
    # Ejecución mensual habitual: día 8 a las 09:00 UTC
    - cron: '0 9 8 * *'

    # Ejecución extraordinaria: 14 de septiembre a las 22:45 de España
    - cron: '45 22 14 9 *'
      timezone: 'Europe/Madrid'

  # Mantiene el botón "Run workflow"
  workflow_dispatch: {}

jobs:
  procesar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar LibreOffice y Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice tesseract-ocr tesseract-ocr-spa poppler-utils

      - name: Instalar las librerias de Python
        run: |
          pip install pypdf openpyxl pytesseract pillow pydrive2 oauth2client reportlab

      - name: Ejecutar el pipeline
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: python Pipeline_Auditoria_Confirming.py
